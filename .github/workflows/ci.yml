name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ROS 2 ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      ROS_DISTRO_NAME: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/mcp_ros2

      # mcp_cpp_sdk is not in the ROS index yet; without it installed, the build fetches the SDK.
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro "$ROS_DISTRO_NAME"
          rosdep install --from-paths src --ignore-src -y --rosdistro "$ROS_DISTRO_NAME" \
            --skip-keys mcp_cpp_sdk
          apt-get install -y --no-install-recommends ccache git \
            "ros-$ROS_DISTRO_NAME-rmw-cyclonedds-cpp" "ros-$ROS_DISTRO_NAME-rmw-zenoh-cpp"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.distro }}-${{ matrix.arch }}

      - name: Build
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          MAKEFLAGS=-j4 colcon build --event-handlers console_cohesion+ --cmake-args \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Test with Fast DDS
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose

      # The unit tests do not use the middleware; the end-to-end tests run again on each one.
      - name: Test with Cyclone DDS
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure \
            --ctest-args -R server
          colcon test-result --verbose

      - name: Test with Zenoh
        env:
          RMW_IMPLEMENTATION: rmw_zenoh_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          ros2 run rmw_zenoh_cpp rmw_zenohd > zenohd.log 2>&1 &
          router=$!
          sleep 2
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure \
            --ctest-args -R server
          colcon test-result --verbose
          kill "$router"

      - name: Smoke-test the binary
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          source install/setup.bash
          ros2 run mcp_ros2 mcp_ros2 --version
          ros2 run mcp_ros2 mcp_ros2 --help

  windows:
    name: ROS 2 ${{ matrix.distro }} Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/mcp_ros2

      # The steps of the ROS 2 Windows binary install: the dependencies come from the pixi
      # environment ros2/ros2 publishes for the distribution, ROS 2 from the newest release that
      # has a Windows archive (not every release does).
      - name: Get ROS 2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force C:\pixi_ws | Out-Null
          Invoke-RestMethod https://raw.githubusercontent.com/ros2/ros2/refs/heads/${{ matrix.distro }}/pixi.toml -OutFile C:\pixi_ws\pixi.toml
          $url = gh api 'repos/ros2/ros2/releases?per_page=100' --jq '[.[] | select(.tag_name | test("^release-${{ matrix.distro }}-[0-9]+$")) | .assets[] | select(.name | test("windows.*\\.zip$"; "i")) | .browser_download_url][0] // empty'
          if (-not $url) { throw "No ${{ matrix.distro }} release has a Windows archive" }
          Write-Output "ROS 2: $url"
          Invoke-WebRequest $url -OutFile ros2.zip
          7z x ros2.zip -oC:\pixi_ws -y | Out-Null
          Remove-Item ros2.zip

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          manifest-path: C:\pixi_ws\pixi.toml
          run-install: false
          cache: false

      # The SDK also needs Boost's headers and nlohmann/json, which the ROS environment may lack.
      - name: Install the dependencies
        shell: pwsh
        working-directory: C:\pixi_ws
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @('libboost-headers>=1.90,<1.91')
          if (-not (Select-String -Path pixi.toml -Pattern '^nlohmann_json\s*=' -Quiet)) {
            $packages += 'nlohmann_json'
          }
          pixi add @packages
          pixi shell-hook --shell cmd | Set-Content -Encoding ascii activate.bat

      - name: Build
        shell: cmd
        run: |
          call C:\pixi_ws\activate.bat || exit /b 1
          call C:\pixi_ws\ros2-windows\local_setup.bat
          colcon build --merge-install --event-handlers console_cohesion+ --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: cmd
        run: |
          call C:\pixi_ws\activate.bat || exit /b 1
          call C:\pixi_ws\ros2-windows\local_setup.bat
          colcon test --merge-install --event-handlers console_cohesion+ --return-code-on-test-failure || exit /b 1
          colcon test-result --verbose

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # cmake-format 0.6 fails on Python 3.15 ("Cannot use capturing groups in re.Scanner").
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
