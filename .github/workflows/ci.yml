name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ROS 2 ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      ROS_DISTRO_NAME: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/mcp_ros2

      # mcp_cpp_sdk is not in the rosdistro index; the build fetches the SDK when it is not installed.
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro "$ROS_DISTRO_NAME"
          rosdep install --from-paths src --ignore-src -y --rosdistro "$ROS_DISTRO_NAME" \
            --skip-keys mcp_cpp_sdk
          apt-get install -y --no-install-recommends ccache git \
            "ros-$ROS_DISTRO_NAME-rmw-cyclonedds-cpp" "ros-$ROS_DISTRO_NAME-rmw-zenoh-cpp"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.distro }}-${{ matrix.arch }}

      - name: Build
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          MAKEFLAGS=-j4 colcon build --event-handlers console_cohesion+ --cmake-args \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Test with Fast DDS
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose

      # Only the end-to-end tests depend on the RMW, so only they run again for each RMW.
      - name: Test with Cyclone DDS
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure \
            --ctest-args -R server
          colcon test-result --verbose

      - name: Test with Zenoh
        env:
          RMW_IMPLEMENTATION: rmw_zenoh_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          ros2 run rmw_zenoh_cpp rmw_zenohd > zenohd.log 2>&1 &
          router=$!
          sleep 2
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure \
            --ctest-args -R server
          colcon test-result --verbose
          kill "$router"

      - name: Smoke-test the binary
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          source install/setup.bash
          ros2 run mcp_ros2 mcp_ros2 --version
          ros2 run mcp_ros2 mcp_ros2 --help

  windows:
    name: ROS 2 ${{ matrix.distro }} Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lyrical: official Windows release. Jazzy: RoboStack, because the newest Jazzy Windows
          # release predates rclcpp_action 28.1.18.
          - distro: jazzy
            source: robostack
            ros_setup: ""
          - distro: lyrical
            source: release
            ros_setup: C:\pixi_ws\ros2-windows\local_setup.bat
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/mcp_ros2

      # Follows the ROS 2 Windows binary install: dependencies from the distribution's pixi.toml in
      # ros2/ros2, ROS 2 from the newest release with a Windows archive (not every release has one).
      - name: Get ROS 2
        if: matrix.source == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force C:\pixi_ws | Out-Null
          Invoke-RestMethod https://raw.githubusercontent.com/ros2/ros2/refs/heads/${{ matrix.distro }}/pixi.toml -OutFile C:\pixi_ws\pixi.toml
          $url = gh api 'repos/ros2/ros2/releases?per_page=100' --jq '[.[] | select(.tag_name | test("^release-${{ matrix.distro }}-[0-9]+$")) | .assets[] | select(.name | test("windows.*\\.zip$"; "i")) | .browser_download_url][0] // empty'
          if (-not $url) { throw "No ${{ matrix.distro }} release has a Windows archive" }
          Write-Output "ROS 2: $url"
          Invoke-WebRequest $url -OutFile ros2.zip
          7z x ros2.zip -oC:\pixi_ws -y | Out-Null
          Remove-Item ros2.zip

      - name: Start a RoboStack workspace
        if: matrix.source == 'robostack'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\pixi_ws | Out-Null
          @"
          [workspace]
          name = "ros"
          channels = ["https://prefix.dev/robostack-${{ matrix.distro }}", "conda-forge"]
          platforms = ["win-64"]

          [dependencies]
          "@ | Set-Content -Path C:\pixi_ws\pixi.toml

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          manifest-path: C:\pixi_ws\pixi.toml
          run-install: false
          cache: false

      # The SDK also needs Boost and nlohmann/json. The release environment's assimp depends on
      # boost-cpp, which conflicts with libboost-devel, so that environment uses boost-cpp.
      # RoboStack uses libboost-devel, whose CMake config files CMake 4 requires, and also provides
      # the ROS packages.
      - name: Install the dependencies
        shell: pwsh
        working-directory: C:\pixi_ws
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @()
          if (-not (Select-String -Path pixi.toml -Pattern '^nlohmann_json\s*=' -Quiet)) {
            $packages += 'nlohmann_json'
          }
          if ('${{ matrix.source }}' -eq 'release') {
            $packages += 'boost-cpp'
          } else {
            $packages += 'libboost-devel>=1.90,<1.91', 'ros-dev-tools', 'cmake', 'openssl'
            $packages += @('ros-base', 'tf2-ros', 'test-msgs', 'example-interfaces', 'ament-cmake-gtest') |
              ForEach-Object { "ros-${{ matrix.distro }}-$_" }
          }
          pixi add @packages
          pixi shell-hook --shell cmd | Set-Content -Encoding ascii activate.bat

      - name: Build
        shell: cmd
        env:
          ROS_SETUP: ${{ matrix.ros_setup }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call C:\pixi_ws\activate.bat || exit /b 1
          if not "%ROS_SETUP%"=="" call "%ROS_SETUP%"
          colcon build --merge-install --event-handlers console_cohesion+ --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: cmd
        env:
          ROS_SETUP: ${{ matrix.ros_setup }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call C:\pixi_ws\activate.bat || exit /b 1
          if not "%ROS_SETUP%"=="" call "%ROS_SETUP%"
          colcon test --merge-install --event-handlers console_cohesion+ --return-code-on-test-failure || exit /b 1
          colcon test-result --verbose

      - name: Smoke test
        shell: cmd
        env:
          ROS_SETUP: ${{ matrix.ros_setup }}
        run: |
          call C:\pixi_ws\activate.bat || exit /b 1
          if not "%ROS_SETUP%"=="" call "%ROS_SETUP%"
          call install\local_setup.bat
          ros2 run mcp_ros2 mcp_ros2 --version || exit /b 1
          ros2 run mcp_ros2 mcp_ros2 --help || exit /b 1

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # cmake-format 0.6 fails on Python 3.15 ("Cannot use capturing groups in re.Scanner").
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
