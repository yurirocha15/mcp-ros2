name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ROS 2 ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      ROS_DISTRO_NAME: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/mcp_ros2

      # mcp_cpp_sdk is not in the ROS index yet; without it installed, the build fetches the SDK.
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro "$ROS_DISTRO_NAME"
          rosdep install --from-paths src --ignore-src -y --rosdistro "$ROS_DISTRO_NAME" \
            --skip-keys mcp_cpp_sdk
          apt-get install -y --no-install-recommends ccache git \
            "ros-$ROS_DISTRO_NAME-rmw-cyclonedds-cpp" "ros-$ROS_DISTRO_NAME-rmw-zenoh-cpp"

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.distro }}-${{ matrix.arch }}

      - name: Build
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          MAKEFLAGS=-j4 colcon build --event-handlers console_cohesion+ --cmake-args \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Test with Fast DDS
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose

      # The unit tests do not use the middleware; the end-to-end tests run again on each one.
      - name: Test with Cyclone DDS
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure \
            --ctest-args -R server
          colcon test-result --verbose

      - name: Test with Zenoh
        env:
          RMW_IMPLEMENTATION: rmw_zenoh_cpp
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          ros2 run rmw_zenoh_cpp rmw_zenohd > zenohd.log 2>&1 &
          router=$!
          sleep 2
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure \
            --ctest-args -R server
          colcon test-result --verbose
          kill "$router"

      - name: Smoke-test the binary
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          source install/setup.bash
          ros2 run mcp_ros2 mcp_ros2 --version
          ros2 run mcp_ros2 mcp_ros2 --help

  windows:
    name: ROS 2 ${{ matrix.distro }} Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/mcp_ros2

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}

      # setup-ros pins colcon releases whose CMake support imports pkg_resources from setuptools
      # 59, which fails on the runner's Python 3.12; newer releases load there.
      - name: Update colcon
        run: python -m pip install -U --upgrade-strategy eager colcon-common-extensions

      - uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: windows-conan-${{ hashFiles('src/mcp_ros2/.github/workflows/ci.yml') }}
          restore-keys: windows-conan-

      # The ROS archive has neither Boost nor nlohmann/json, and its OpenSSL is 1.1, so the SDK's
      # dependencies come from Conan; OpenSSL 3 is linked statically, next to ROS's own copy.
      - name: Install the SDK's dependencies
        shell: pwsh
        run: |
          python -m pip install conan ninja
          conan profile detect --force
          @"
          [requires]
          boost/1.90.0
          nlohmann_json/3.12.0
          openssl/3.6.5
          [options]
          boost/*:header_only=True
          openssl/*:shared=False
          [generators]
          CMakeDeps
          "@ | Set-Content -Path deps.txt
          conan install deps.txt --output-folder=deps --build=missing -s build_type=Release -s compiler.cppstd=20

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call C:\dev\${{ matrix.distro }}\ros2-windows\local_setup.bat
          colcon build --merge-install --event-handlers console_cohesion+ --cmake-args -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON "-DCMAKE_PREFIX_PATH=%CD%\deps"

      - name: Test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call C:\dev\${{ matrix.distro }}\ros2-windows\local_setup.bat
          set "PATH=C:\Program Files\OpenSSL-Win64\bin;%PATH%"
          colcon test --merge-install --event-handlers console_cohesion+ --return-code-on-test-failure || exit /b 1
          colcon test-result --verbose

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # cmake-format 0.6 fails on Python 3.15 ("Cannot use capturing groups in re.Scanner").
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
